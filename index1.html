<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра Однорукий бандит</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        #player-name {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
        #attempt-text {
            font-style: italic;
            font-size: 18px;
        }
        button {
            background-color: #00e600;
            color: black;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #00cc00;
        }
        button:active {
            transform: scale(0.95);
        }
        
        .slot-machine {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            background-color: #444; /* Темний фон ігрового автомата */
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        .slot {
            background-color: #7a9cff;
            border: 3px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            border-radius: 5px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        #result-message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 22px;
            min-height: 26px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="player-name">User</div>
        <div id="attempt-text">Спроба 0 з 3</div>
        
        <button id="generate-btn">Generate</button>
        
        <div class="slot-machine" id="slot-machine">
            <!-- 9 блоків для карток -->
            <div class="slot" id="slot-0"></div>
            <div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div>
            <div class="slot" id="slot-3"></div>
            <div class="slot" id="slot-4"></div>
            <div class="slot" id="slot-5"></div>
            <div class="slot" id="slot-6"></div>
            <div class="slot" id="slot-7"></div>
            <div class="slot" id="slot-8"></div>
        </div>

        <div id="result-message"></div>
    </div>

    <script>
        const images = ['🍎', '🍐', '🍋', '🍑', '🍒'];
        
        let userName = "";
        let iteration = 0;

        // Запит імені користувача під час завантаження сторінки
        window.onload = () => {
            while (!userName || userName.trim() === "") {
                userName = prompt("Введіть ваше ім'я для початку гри:");
                if (userName === null) userName = "User"; 
            }
            document.getElementById('player-name').textContent = userName;
            fillInitialEmptySlots();
        };

        function getUniqueColumn() {
            let shuffled = [...images].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 3);
        }

        function fillInitialEmptySlots() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach(slot => slot.textContent = '❓');
        }

        document.getElementById('generate-btn').addEventListener('click', function() {
            if (iteration < 3) {
                iteration++;
                document.getElementById('attempt-text').textContent = `Спроба ${iteration} з 3`;

                const col1 = getUniqueColumn();
                const col2 = getUniqueColumn();
                const col3 = getUniqueColumn();

                const rows = [
                    [col1[0], col2[0], col3[0]], // Перший ряд (горизонталь)
                    [col1[1], col2[1], col3[1]], // Другий ряд
                    [col1[2], col2[2], col3[2]]  // Третій ряд
                ];

                const slots = document.querySelectorAll('.slot');
                let slotIndex = 0;
                
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        const currentSlot = slots[slotIndex];
                        currentSlot.textContent = rows[r][c];
                        currentSlot.style.backgroundColor = '#7a9cff';
                        currentSlot.style.transform = 'scale(1.15)';   
                        
                        setTimeout(() => {
                            currentSlot.style.transform = 'scale(1)'; 
                        }, 250);
                        
                        slotIndex++;
                    }
                }

                let winningRow = -1;
                for (let r = 0; r < 3; r++) {
                    if (rows[r][0] === rows[r][1] && rows[r][1] === rows[r][2]) {
                        winningRow = r;
                        break;
                    }
                }

                const resultMsg = document.getElementById('result-message');

                if (winningRow !== -1) {
                    resultMsg.textContent = `🎉 Вітаємо, ${userName}! Ви перемогли!`;
                    resultMsg.style.color = 'green';
                    
                    const startIdx = winningRow * 3;
                    slots[startIdx].style.backgroundColor = 'gold';
                    slots[startIdx + 1].style.backgroundColor = 'gold';
                    slots[startIdx + 2].style.backgroundColor = 'gold';
                    
                    this.style.display = 'none'; 
                    
                } else if (iteration === 3) {
                    resultMsg.textContent = "На жаль, ви програли. Спроби вичерпано!";
                    resultMsg.style.color = 'red';
                    this.style.display = 'none'; 
                }
            }
        });
    </script>
</body>
</html>
