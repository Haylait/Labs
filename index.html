<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №11 - Language learning</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card {
            width: 100%;
            height: 200px;
            background: #fff;
            border: 2px solid #eaeaea;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .card:active {
            transform: translateY(0);
        }
        .step-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #007bff;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input.error {
            border-color: #dc3545;
            background-color: #fff3f3;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            font-size: 16px;
        }
        .stats .title {
            width: 100%;
            text-align: center;
            color: #007bff;
            margin-bottom: 5px;
        }
        .correct-stat { color: #28a745; }
        .incorrect-stat { color: #dc3545; }
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal h2 { margin-top: 0; }
        .btn-restart {
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-restart:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card" id="word-card" title="Натисніть для перевірки">
        always
    </div>

    <div class="step-info">
        <span id="step-counter">1/10</span>
    </div>

    <input type="text" id="translation-input" placeholder="введіть переклад">

    <div class="stats-container">
        <div class="stats title">Статистика</div>
        <div class="stats">
            <div class="correct-stat">Вірно<br><span id="correct-count">0</span></div>
            <div class="incorrect-stat">Невірно<br><span id="incorrect-count">0</span></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="result-modal">
    <div class="modal">
        <h2>Рівень знань мови</h2>
        <p id="final-score"></p>
        <p id="proficiency-level" style="font-weight: bold; font-size: 20px;"></p>
        <button class="btn-restart" id="restart-btn">Почати заново</button>
    </div>
</div>

<script>
$(document).ready(function() {
    const initialDictionary = [
        { word: "always", translation: "завжди" },
        { word: "never", translation: "ніколи" },
        { word: "often", translation: "часто" },
        { word: "sometimes", translation: "іноді" },
        { word: "usually", translation: "зазвичай" },
        { word: "apple", translation: "яблуко" },
        { word: "book", translation: "книга" },
        { word: "window", translation: "вікно" },
        { word: "time", translation: "час" },
        { word: "friend", translation: "друг" }
    ];

    let words = [];
    let currentIndex = 0;
    let correctAnswers = 0;
    let incorrectAnswers = 0;

    function initGame() {
        words = [...initialDictionary].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        correctAnswers = 0;
        incorrectAnswers = 0;
        
        updateStats();
        loadWord();
    }

    function loadWord() {
        if (currentIndex < words.length) {
            $('#word-card').text(words[currentIndex].word);
            $('#step-counter').text(`${currentIndex + 1}/${words.length}`);
            $('#translation-input').val('').removeClass('error').focus();
        } else {
            showResults();
        }
    }

    function updateStats() {
        $('#correct-count').text(correctAnswers);
        $('#incorrect-count').text(incorrectAnswers);
    }

    $('#word-card').on('click', function() {
        const inputField = $('#translation-input');
        const userAnswer = inputField.val().trim().toLowerCase();
        
        if (userAnswer === "") {
            inputField.addClass('error');
            inputField.attr('placeholder', 'Введіть текст!');
            return;
        }

        const correctAnswer = words[currentIndex].translation.toLowerCase();

        if (userAnswer === correctAnswer) {
            correctAnswers++;
        } else {
            incorrectAnswers++;
        }

        updateStats();
        currentIndex++;
        loadWord();
    });

    $('#translation-input').on('input', function() {
        $(this).removeClass('error');
        $(this).attr('placeholder', 'введіть переклад');
    });
    
    $('#translation-input').on('keypress', function(e) {
        if(e.which == 13) {
            $('#word-card').click();
        }
    });

    function showResults() {
        $('#final-score').text(`Вірно: ${correctAnswers}, Невірно: ${incorrectAnswers}`);
        
        let level = "";
        let color = "";
        
        if (correctAnswers === 10) {
            level = "Відмінно (C1/C2)";
            color = "#28a745";
        } else if (correctAnswers >= 7) {
            level = "Добре (B1/B2)";
            color = "#17a2b8";
        } else if (correctAnswers >= 4) {
            level = "Задовільно (A2)";
            color = "#ffc107";
        } else {
            level = "Потрібно більше практики (A1)";
            color = "#dc3545";
        }

        $('#proficiency-level').text(level).css('color', color);
        $('#result-modal').css('display', 'flex');
    }

    $('#restart-btn').on('click', function() {
        $('#result-modal').css('display', 'none');
        initGame();
    });

    initGame();
});
</script>
</body>
</html>
